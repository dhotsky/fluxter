targets:
  $default:
    builders:
      source_gen|combining_builder:
        options:
          build_extensions:
            '^lib/{{path}}/{{file}}.dart': 'lib/gen/{{path}}/{{file}}.g.dart'
      freezed|freezed:
        options:
          build_extensions:
            '^lib/{{path}}/{{file}}.dart': 'lib/gen/{{path}}/{{file}}.freezed.dart'
